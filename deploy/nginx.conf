# nginx TLS termination for a spool. proxy_read_timeout must exceed the daemon's
# 30 s WebSocket ping period or idle-but-healthy connections get cut.
# Pair with SPOOL_TRUST_PROXY=true so per-IP limits see the real client address.
# To have compose bring the proxy up too, use ./docker-compose.tls.yml (Caddy).
#
# In http {} context, so nginx's default access log never records the bearer token —
# $request and $request_uri both carry the ?k= it rides in, $uri does not:
#
#   log_format spool '$remote_addr - [$time_local] "$request_method $uri" '
#                    '$status $body_bytes_sent';
server {
    listen 443 ssl;
    server_name spool.example.com;

    # ssl_certificate     /etc/letsencrypt/live/spool.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/spool.example.com/privkey.pem;

    # Off by default: the inherited http{} format would log the token (see header).
    access_log off;
    # access_log /var/log/nginx/spool.log spool;

    # /metrics is only token-gated on private spools, and it exposes scope counts and
    # traffic shape. Scrape it over the loopback bind instead of the internet.
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:9470;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
