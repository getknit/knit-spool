# Overlay: pull the image from a private registry instead of building it on the host.
#
# The base file builds from source, which wants a JDK, a Gradle download and ~1 GB of RAM —
# more than a $5 box should spend on every deploy. This overlay replaces that with a pull.
#
#   # once per host — creates /root/.docker/config.json
#   docker login github.com:5050 -u <deploy-token-username> --password-stdin <<< '<token>'
#
#   # every deploy
#   cd deploy && $EDITOR .env          # set SPOOL_IMAGE to the tag you want live
#   docker compose -f docker-compose.tls.yml -f docker-compose.registry.yml pull
#   docker compose -f docker-compose.tls.yml -f docker-compose.registry.yml up -d
#
# Use a *deploy token* scoped to read_registry, not a personal access token: it is
# project-scoped, cannot push over the image you are running, and can be revoked without
# disturbing anything else.
#
# `!reset` needs Compose v2.24+ (`docker compose version`). On older Compose, drop the
# `build:` line from docker-compose.tls.yml instead of using this overlay.

name: knit-spool

services:
  spool:
    # Drop the base file's `build: ..` — this host pulls, it does not compile.
    build: !reset null
    # Pin a specific tag. The pipeline publishes an immutable $CI_COMMIT_SHORT_SHA tag for
    # every build of the default branch, plus a `latest` that moves. Pin the short SHA (or a
    # @sha256: digest) so a restart six weeks from now brings back the same daemon it had
    # before, and roll forward deliberately by editing SPOOL_IMAGE.
    image: "${SPOOL_IMAGE:?set SPOOL_IMAGE in deploy/.env}"
    # Never silently fall back to a stale local copy when the pin changes.
    pull_policy: always
