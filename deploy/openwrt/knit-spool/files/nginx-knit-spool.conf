# Knit Spool behind nginx on OpenWrt (nginx-ssl), TLS terminated here and the daemon on loopback
# (ADR 2026-11.zmc3). Installed as an example: copy it to /etc/nginx/conf.d/knit-spool.conf, put
# your host name and certificate paths in, and `service nginx reload`. The acme package
# (acme-acmesh) writes certificates to /etc/ssl/acme/<host>.fullchain.crt and <host>.key.
#
# proxy_read_timeout must exceed the daemon's 30 s WebSocket ping period, or idle-but-healthy
# connections get cut. Pair with SPOOL_TRUST_PROXY=true (the package's env file sets it) so the
# per-address limits see clients rather than 127.0.0.1.
#
# Open 443 from wan in the firewall for this server, never 9470: the daemon speaks plaintext and the
# token rides in its URL.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name spool.example.com;

    ssl_certificate     /etc/ssl/acme/spool.example.com.fullchain.crt;
    ssl_certificate_key /etc/ssl/acme/spool.example.com.key;

    # Off: nginx's default log format records the request URI, and the bearer token rides in it.
    access_log off;

    # /metrics exposes scope counts and traffic shape; read it from the box, never from the Internet.
    location = /metrics {
        return 404;
    }

    # /source is deliberately NOT sealed. It is the AGPL §13 offer and must reach the people whose
    # clients connect; it discloses nothing about traffic, scopes or who is connected.

    location / {
        proxy_pass http://127.0.0.1:9470;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
