# Overlay for a 1 GB box (Linode Nanode and the like), layered over docker-compose.tls.yml:
#
#   docker compose -f docker-compose.tls.yml -f docker-compose.tiny.yml up -d
#
# Three things change. The image is pulled or side-loaded rather than built — Gradle wants
# more memory than the whole box has. Each container gets a ceiling, so an overrun is a
# container restart instead of the kernel's OOM killer picking a victim (which, on a box
# this size, is often sshd). And the json log driver gets capped, because Caddy's access
# log otherwise grows without bound on a 25 GB disk.
#
# Side-loading the image over SSH, no registry needed:
#
#   docker save knit-spool:latest | gzip | ssh root@<host> 'gunzip | docker load'
#
# (docker save/load, not export/import — the latter flattens a container and drops the
# ENTRYPOINT, ENV, USER, VOLUME, and HEALTHCHECK this image relies on.)

services:
  spool:
    image: "${SPOOL_IMAGE:-knit-spool:latest}"
    build: !reset null
    # The JVM is pinned to -Xmx256m; ~450 MB RSS with metaspace, threads, and CIO's
    # direct buffers. 512 MB leaves the heap room to spike without taking the box down.
    mem_limit: 512m
    # Sizing for this tier. The daemon's own defaults track the spec's §12 constants and are
    # deliberately left alone; these are deployment policy for a 1 GB box on a metered link.
    #
    # A $5-tier box's binding constraint is not CPU — the store thread sustains order-1000
    # pushes/s here, while 1 TB/month of transfer works out to ~386 KB/s sustained outbound.
    # Every push is amplified by (subscribers - 1) on fan-out, so blob size sets the bill.
    environment:
      # 32 KiB, half the 64 KiB default: every frame is amplified by (subscribers - 1) on
      # fan-out, so this is the knob that sets the monthly transfer bill.
      SPOOL_MAX_BLOB: "${SPOOL_MAX_BLOB:-32768}"
      # 1 MiB per scope, down from the 16 MiB default. Attachments are the largest single
      # thing this spool will ever move, so on a metered link the default is a poor fit for
      # the tier. Note this budget is *per scope*, not spool-wide — but attachment bytes do
      # count toward SPOOL_MAX_BYTES, so the global watermark still bounds total disk and
      # sheds oldest-scope-first. 0 switches attachments off entirely, and the daemon then
      # omits all three attachment limits from HELLO (spec §7.3).
      SPOOL_MAX_ATTACH_BYTES: "${SPOOL_MAX_ATTACH_BYTES:-1048576}"
      # 64 scopes is the first ceiling any real deployment hits, and it is nowhere near a
      # hardware limit — a scope is a row plus a subscriber set. SPOOL_MAX_BYTES still bounds
      # total payload. Past ~1000, raise SPOOL_SWEEP_MS with it: the sweeper walks every scope
      # on the single store thread each tick.
      SPOOL_MAX_SCOPES: "${SPOOL_MAX_SCOPES:-512}"
      # 16 is low wherever carrier-grade NAT puts many mobile clients behind one address.
      SPOOL_MAX_CONNS_PER_IP: "${SPOOL_MAX_CONNS_PER_IP:-64}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
