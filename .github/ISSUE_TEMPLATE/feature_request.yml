name: 💡 Feature request
description: Propose a feature or enhancement for knit-spool.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the proposal. **Please search existing issues before opening a new one.**

        - knit-spool is a **best-effort hobby project** — proposals are welcome but may not be
          accepted.
        - **Read this first: the spec is the product.** Behavior the spool protocol does not
          describe is out of scope for this daemon, and a change to the protocol itself belongs in
          the Knit repo
          ([`docs/SPOOL_PROTOCOL.md`](https://github.com/getknit/knit/blob/main/docs/SPOOL_PROTOCOL.md)),
          not here — this repo follows once it lands. See `CONTRIBUTING.md`.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that a spool doesn't support today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like to see happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why this one.
  - type: dropdown
    id: spec-impact
    attributes:
      label: Spec impact
      description: >-
        Does this need a change to the wire contract, the handshake's advertised limits, the digest,
        or the PoW rules?
      options:
        - No spec change — ops, storage, deployment, performance, or config only
        - Needs a spec change (a Knit-repo discussion first — link it below)
        - Not sure
    validations:
      required: true
  - type: input
    id: spec-issue
    attributes:
      label: Linked Knit-repo spec discussion
      description: If this needs a spec change, link the issue or PR in the Knit repo.
      placeholder: "https://github.com/getknit/knit/issues/NN"
  - type: textarea
    id: blindness
    attributes:
      label: Blindness impact
      description: >-
        A spool sees scope ids, blob ids, ciphertext, sizes, and timing — and must never learn node
        ids, plaintext, rosters, or delivery facts. Does this proposal log, persist, export, or
        derive anything outside that set? See `SECURITY.md`.
    validations:
      required: true
  - type: textarea
    id: footprint
    attributes:
      label: Footprint
      description: >-
        The daemon is sized to idle in ~128–256 MB on the cheapest VPS tier. Does this add per-scope
        or per-connection state, a background thread, or a dependency?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I understand knit-spool is a best-effort hobby project and this may not be accepted.
          required: true
