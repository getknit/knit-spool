# Issue-template chooser for knit-spool.
# https://docs.github.com/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository
#
# Blank issues are disabled so reports flow through the Bug / Feature forms; open-ended questions go
# to Discussions via the link below. Flip blank_issues_enabled to true to also accept free-form
# issues.
#
# The protocol link is deliberately pointed at the Knit repo: the spec is the product, so a defect
# in the *spec* is filed there and this daemon follows once it lands.
blank_issues_enabled: false
contact_links:
  - name: 🔒 Report a security vulnerability (private)
    url: https://github.com/getknit/knit-spool/security/advisories/new
    about: >-
      Do NOT open a public issue for security bugs. Use GitHub's private vulnerability reporting (or
      email, per SECURITY.md) — public disclosure before a fix exists puts the people relying on
      running spools at risk.
  - name: 📐 The spool protocol spec (Knit repo)
    url: https://github.com/getknit/knit/blob/main/docs/SPOOL_PROTOCOL.md
    about: >-
      The normative wire contract lives in the Knit repo. If the *spec* is what looks wrong, open it
      there — this daemon implements the spec and follows once a change lands.
  - name: 💬 Questions & general discussion
    url: https://github.com/getknit/knit-spool/discussions
    about: For operator questions, ideas, and open-ended discussion that isn't a bug or a concrete feature request.
  - name: 📖 Contributing guide & support expectations
    url: https://github.com/getknit/knit-spool/blob/main/CONTRIBUTING.md
    about: knit-spool is a best-effort hobby project shipped as-is. Please read this before filing.
